# Rumah SUM V2: Worker yang menjalankan kode GAS SUM V2 yang ASLI di atas cermin Supabase
# (keputusan Gabriel 14 Nov 2026, "GAS asli di Worker"). Selama saklar "gas", semua aksi diteruskan ke web app GAS.
# Penjelasan: workers/sum/README.md.
#
# gas/gas-kamar.js TIDAK ada di repo (repo publik). Buat sebelum setiap deploy:
#   node tools/kembar/bundel-gas.mjs --kamar=sum
# Script dan versinya dari config/rumah.json sum.gas.
name = "abadiops-sum"
main = "src/index.js"
compatibility_date = "2026-10-01"
# node:crypto dan node:buffer untuk Utilities.computeDigest dan base64Encode (workers/bersama/gas-host.js).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "sum.abadiops.com", custom_domain = true }
]

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# Service binding ke Pintu untuk membaca posisi saklar (Bug #27). Tanpa ikatan, saklar = var SAKLAR.
services = [
  { binding = "PINTU", service = "abadiops-pintu" }
]

# File PWA SUM V2 (salinan 1:1, hanya alamat API yang diganti ./api).
# html_handling "none": /index.html disajikan langsung (200, tanpa redirect).
[assets]
directory = "../../pwa/sum"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[vars]
RUMAH = "sum"
# Cadangan bila pintu tidak terjangkau: tetap GAS.
SAKLAR = "gas"
# Web app GAS produksi SUM V2 (script 1k_A_KERx8GJAamYu8SJ4ef1ddla1B3VYAao8w6XEuGs-P7XvA6uRnGll).
GAS_URL = "https://script.google.com/macros/s/AKfycbzB5EUJlpGRaDTFvfr3bl117hd_Oa2k4seCecTYy4Ct8_oYRefu8U9BqG6zu3M-BoFS/exec"
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"

[observability]
enabled = true

# Panggung Latihan (Staging) - docs/GEDUNG-DAN-STAGING.md §2. Tanpa GAS: semua aksi di aksi_worker dijawab
# dari cermin sum di Gedung 2; aksi lain ditolak. Rahasia: SUPABASE_SERVICE_ROLE_KEY (kunci rahasia
# Supabase Gedung 2), dipasang dengan `wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging`.
[env.staging]
name = "abadiops-sum-staging"
workers_dev = true
routes = []

services = [
  { binding = "PINTU", service = "abadiops-pintu-staging" }
]

[env.staging.vars]
RUMAH = "sum"
GAS_URL = ""
SUPABASE_URL = "https://dnnqrslftndcbmnvuveb.supabase.co"
