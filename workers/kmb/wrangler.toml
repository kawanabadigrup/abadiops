# Rumah KMB TRA / V2: Worker yang menjalankan kode GAS KMB TRA / V2 yang ASLI di atas cermin Supabase
# (keputusan Gabriel 14 Nov 2026, "GAS asli di Worker"). Selama saklar "gas", semua aksi diteruskan ke web app GAS.
# Penjelasan: workers/kmb/README.md.
#
# gas/gas-kamar.js TIDAK ada di repo (repo publik). Buat sebelum setiap deploy:
#   node tools/kembar/bundel-gas.mjs --kamar=kmbtra
# Script dan versinya dari config/rumah.json kmbtra.gas.
name = "abadiops-kmb"
main = "src/index.js"
compatibility_date = "2026-10-01"
# node:crypto dan node:buffer untuk Utilities.computeDigest dan base64Encode (workers/bersama/gas-host.js).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "kmbtra.abadiops.com", custom_domain = true }
]

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# Service binding ke Pintu untuk membaca posisi saklar (Bug #27). Tanpa ikatan, saklar = var SAKLAR.
services = [
  { binding = "PINTU", service = "abadiops-pintu" }
]

# File PWA KMB TRA / V2 (salinan 1:1, hanya alamat API yang diganti ./api).
# html_handling "none": /index.html disajikan langsung (200, tanpa redirect).
[assets]
directory = "../../pwa/kmb"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[vars]
RUMAH = "kmbtra"
# Cadangan bila pintu tidak terjangkau: tetap GAS.
SAKLAR = "gas"
# Web app GAS produksi KMB TRA / V2 (script 17sBKK-x3qXzL7tRlejsXE1kQXGwF-CQtCoCdhA4ZWE4_E2NSq0ZUwtqo).
GAS_URL = "https://script.google.com/macros/s/AKfycbwlwlQvOGVF6FdKkYRNlbgdJCets5L-0AfufMB4_79_HzvoQkeE9aZAqkKZiXCZHXnG6Q/exec"
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"

[observability]
enabled = true

# Panggung Latihan (Staging) - docs/GEDUNG-DAN-STAGING.md §2. Tanpa GAS: semua aksi di aksi_worker dijawab
# dari cermin kmb di Gedung 2; aksi lain ditolak. Rahasia: SUPABASE_SERVICE_ROLE_KEY (kunci rahasia
# Supabase Gedung 2), dipasang dengan `wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging`.
[env.staging]
name = "abadiops-kmb-staging"
workers_dev = true
routes = []

services = [
  { binding = "PINTU", service = "abadiops-pintu-staging" }
]

[env.staging.vars]
RUMAH = "kmbtra"
GAS_URL = ""
# Ruang uji di Gedung 1 (docs/SAKLAR.md, 14 Nov): Worker uji membaca/menulis skema uji_*; cermin asli terkunci.
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"
SKEMA_AWALAN = "uji_"
