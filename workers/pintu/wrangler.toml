# Pintu Abadi Operation: halaman netral di abadiops.com. Mengenali rumah dari token
# (ping ke GAS semua rumah sekaligus), lalu mengantar pengguna ke aplikasi rumahnya.
# Bagian bersama (AGENTS.md §2). Keputusan: docs/KEPUTUSAN.md 28 Okt 2026.
name = "abadiops-pintu"
main = "src/index.js"
compatibility_date = "2026-10-01"
# node:crypto untuk tiruan layanan Google dan penyusun perubahan cermin (pusat admin, src/admin-cermin.js).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# abadiops.com dipindah ke Worker ini lewat dashboard, SESUDAH pintu terbukti berjalan
# (lihat docs/PROGRES.md). Jangan menambah `routes` di sini sebelum itu.

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

# Durable Object untuk Panel Saklar Dua Cabang (docs/SAKLAR.md)
[durable_objects]
bindings = [
  { name = "SAKLAR_DO", class_name = "SaklarDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SaklarDO"]

# Daftar rumah. Ini konfigurasi, bukan kode (haram hardcode, AGENTS.md §5): menambah rumah,
# misalnya kmbbupr, cukup menambah satu baris di sini lalu deploy. Alamat GAS disalin dari
# GAS_URLS di worker.js; alamat aplikasi = <kode>.abadiops.com; web = halaman web GAS rumah itu
# (sekarang sama dengan alamat API-nya), dibuka dengan ?token= (keputusan 29 Okt nomor 10).
# web tetap ke GAS sampai <kode>.abadiops.com/web lulus perbandingan berdampingan dengan web GAS
# (SERAH-TERIMA §5 langkah 6). Versi 30 Okt siang tampil tanpa data: bug #24, #25.
[vars]
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_PoWC64yv25bZizBrTL79vw_CuNQwhp3"
RUMAH = [
  { kode = "kmbprojek", nama = "KMB Projek", gas = "https://script.google.com/macros/s/AKfycbxh4086qGRZGDqAvdpO7UDdsvqk1Li9NR2rFZLlyVS6gS1zpGrZdcEsb_z-HzKOY02Y/exec", alamat = "https://kmbprojek.abadiops.com/", web = "https://script.google.com/macros/s/AKfycbxh4086qGRZGDqAvdpO7UDdsvqk1Li9NR2rFZLlyVS6gS1zpGrZdcEsb_z-HzKOY02Y/exec" },
  { kode = "sum", nama = "SUM", gas = "https://script.google.com/macros/s/AKfycbzB5EUJlpGRaDTFvfr3bl117hd_Oa2k4seCecTYy4Ct8_oYRefu8U9BqG6zu3M-BoFS/exec", alamat = "https://sum.abadiops.com/", web = "https://script.google.com/macros/s/AKfycbzB5EUJlpGRaDTFvfr3bl117hd_Oa2k4seCecTYy4Ct8_oYRefu8U9BqG6zu3M-BoFS/exec" },
  { kode = "kmbtra", nama = "KMB TRA", gas = "https://script.google.com/macros/s/AKfycbwlwlQvOGVF6FdKkYRNlbgdJCets5L-0AfufMB4_79_HzvoQkeE9aZAqkKZiXCZHXnG6Q/exec", alamat = "https://kmbtra.abadiops.com/", web = "https://script.google.com/macros/s/AKfycbwlwlQvOGVF6FdKkYRNlbgdJCets5L-0AfufMB4_79_HzvoQkeE9aZAqkKZiXCZHXnG6Q/exec" },
]

[observability]
enabled = true

# Panggung Latihan (Staging) - docs/GEDUNG-DAN-STAGING.md §2
[env.staging]
name = "abadiops-pintu-staging"
workers_dev = true

services = [
  { binding = "GAS_TIRUAN", service = "abadiops-gas-tiruan" }
]

[env.staging.durable_objects]
bindings = [
  { name = "SAKLAR_DO", class_name = "SaklarDO" }
]

[env.staging.vars]
# Staging tidak punya GAS sungguhan; Gedung 2 satu-satunya sumber data, jadi pusat admin boleh menulis tanpa
# menunggu saklar "supabase" (src/admin-cermin.js izinTulis). Produksi tidak memakai variabel ini.
LINGKUNGAN = "staging"
# Ruang uji di Gedung 1 (docs/SAKLAR.md, 14 Nov): Worker uji membaca/menulis skema uji_*; cermin asli terkunci.
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"
SKEMA_AWALAN = "uji_"
SUPABASE_ANON_KEY = "sb_publishable_PoWC64yv25bZizBrTL79vw_CuNQwhp3"
RUMAH = [
  { kode = "kmbprojek", nama = "KMB Projek (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/kmbprojek", alamat = "https://abadiops-kmbprojek-staging.kawanabadigrup.workers.dev/", web = "https://abadiops-kmbprojek-staging.kawanabadigrup.workers.dev/web" },
  { kode = "sum", nama = "SUM (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/sum", alamat = "https://abadiops-sum-staging.kawanabadigrup.workers.dev/", web = "https://abadiops-sum-staging.kawanabadigrup.workers.dev/web" },
  { kode = "kmbtra", nama = "KMB TRA (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/kmbtra", alamat = "https://abadiops-kmb-staging.kawanabadigrup.workers.dev/", web = "https://abadiops-kmb-staging.kawanabadigrup.workers.dev/web" },
  { kode = "kmbbupr", nama = "KMB Projek BUPR (Staging)", gas = "https://abadiops-gas-tiruan.kawanabadigrup.workers.dev/kmbbupr", alamat = "https://abadiops-kmbbupr-staging.kawanabadigrup.workers.dev/", web = "https://abadiops-kmbbupr-staging.kawanabadigrup.workers.dev/web" },
]
