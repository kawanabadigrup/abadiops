# Rumah KMB Projek: Worker yang menjalankan kode GAS KMB Projek yang ASLI di atas cermin Supabase
# (keputusan Gabriel 14 Nov 2026, "GAS asli di Worker"). Selama saklar "gas", semua aksi diteruskan ke web app GAS.
# Penjelasan: workers/kmbprojek/README.md.
#
# gas/gas-kamar.js TIDAK ada di repo (repo publik). Buat sebelum setiap deploy:
#   node tools/kembar/bundel-gas.mjs --kamar=kmbprojek
# Script dan versinya dari config/rumah.json kmbprojek.gas.
name = "abadiops-porject-kmb"
main = "src/index.js"
compatibility_date = "2026-10-01"
# node:crypto dan node:buffer untuk Utilities.computeDigest dan base64Encode (workers/bersama/gas-host.js).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Domain: kmbprojek.abadiops.com dipasang via dashboard Cloudflare (Settings -> Domains & Routes)
# sama seperti abadiops.com, agar deploy lewat API token tanpa izin zona tidak gagal.

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# Service binding ke Pintu untuk membaca posisi saklar (Bug #27).
services = [
  { binding = "PINTU", service = "abadiops-pintu" }
]

# File PWA KMB Project (salinan 1:1 dari mar-projek-offline, hanya alamat API yang diganti).
# html_handling "none": /index.html disajikan langsung (200, tanpa redirect).
[assets]
directory = "../../pwa/kmbprojek"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[vars]
RUMAH = "kmbprojek"
# Web app GAS produksi KMB Project (script 1cKrVdmxH_hD4yVTwqLAXKdUjwM5wd7Glh4MdlpT7oP8KDOaGNgJCJVyh).
GAS_URL = "https://script.google.com/macros/s/AKfycbxh4086qGRZGDqAvdpO7UDdsvqk1Li9NR2rFZLlyVS6gS1zpGrZdcEsb_z-HzKOY02Y/exec"
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"

[observability]
enabled = true

# Panggung Latihan (Staging) - docs/GEDUNG-DAN-STAGING.md §2. Tanpa GAS: semua aksi di aksi_worker dijawab
# dari cermin kmb_projek di Gedung 2; aksi lain ditolak. Rahasia: SUPABASE_SERVICE_ROLE_KEY (kunci rahasia
# Supabase Gedung 2), dipasang dengan `wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging`.
[env.staging]
name = "abadiops-kmbprojek-staging"
workers_dev = true

services = [
  { binding = "PINTU", service = "abadiops-pintu-staging" }
]

[env.staging.vars]
RUMAH = "kmbprojek"
GAS_URL = ""
# Ruang uji di Gedung 1 (docs/SAKLAR.md, 14 Nov): Worker uji membaca/menulis skema uji_*; cermin asli terkunci.
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"
SKEMA_AWALAN = "uji_"
