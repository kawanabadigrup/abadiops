# Worker GAS Tiruan (Staging Panggung Latihan)
# HARAM menyentuh Google Apps Script / Spreadsheet Produksi (AGENTS.md §5 & docs/GEDUNG-DAN-STAGING.md §2).
# Melayani permintaan simulasi GAS untuk pintu dan rumah di panggung staging.
name = "abadiops-gas-tiruan"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

account_id = "9273ece6d47a3bb103159295c10ce9e6"

# Kamar yang menjalankan kode GAS asli di Worker-nya sendiri: permintaan /<kode> diteruskan ke Worker itu.
# Nama ikatan RUMAH_<KODE KAMAR> (src/index.js membacanya dari kode kamar).
services = [
  { binding = "RUMAH_KMBBUPR", service = "abadiops-kmbbupr-staging" },
  { binding = "RUMAH_KMBPROJEK", service = "abadiops-kmbprojek-staging" },
  { binding = "RUMAH_KMBTRA", service = "abadiops-kmb-staging" },
  { binding = "RUMAH_SUM", service = "abadiops-sum-staging" }
]

[vars]
SUPABASE_URL = "https://dnnqrslftndcbmnvuveb.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_HgQd9sXhK3-CrFyUId-LEw_q_ah2S0O"

[observability]
enabled = true

