# Rumah KMB Projek BUPR: Worker yang menjalankan kode GAS BUPR yang ASLI di atas cermin Supabase
# (keputusan Gabriel 14 Nov 2026, "GAS asli di Worker"). Penjelasan: workers/kmbbupr/README.md.
#
# gas/gas-kamar.js TIDAK ada di repo (repo publik). Buat sebelum setiap deploy:
#   node tools/kembar/bundel-gas.mjs --kamar=kmbbupr
# Script dan versinya dari config/rumah.json kmbbupr.gas.
name = "abadiops-kmbbupr"
main = "src/index.js"
compatibility_date = "2026-10-01"
# node:crypto dan node:buffer untuk Utilities.computeDigest dan base64Encode (workers/bersama/gas-host.js).
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Akun Cloudflare kawanabadigrup. Dikunci supaya deploy tidak pernah nyasar ke akun lain.
account_id = "9273ece6d47a3bb103159295c10ce9e6"

# Produksi BELUM PERNAH di-deploy (langkah 5 rencana BUPR). Saklar BUPR belum ada di RUMAH pintu produksi,
# jadi saklarnya 'gas' dan semua aksi diteruskan ke web app GAS BUPR.
services = [
  { binding = "PINTU", service = "abadiops-pintu" }
]

# File PWA BUPR: salinan 1:1 kawanabadigrup/PWA-Project-KMB2 (ba4d81d, 5 Nov 2026); hanya alamat API diganti ./api.
# html_handling "none": /index.html disajikan langsung (200, tanpa redirect).
[assets]
directory = "../../pwa/kmbbupr"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[vars]
RUMAH = "kmbbupr"
# Web app GAS produksi BUPR (deployment yang dipakai PWA BUPR).
GAS_URL = "https://script.google.com/macros/s/AKfycbykSslm5SFzAHRGJRLApDVNvR2JvZzW_Y3JEazdXaISJxADGlXwEWXHNg9pwpr4SJ73/exec"
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"

[observability]
enabled = true

# Panggung Latihan (Staging) - docs/GEDUNG-DAN-STAGING.md §2. Tanpa GAS: semua aksi di aksi_worker dijawab
# dari cermin kmbbupr di Gedung 2; aksi lain ditolak. Rahasia: SUPABASE_SERVICE_ROLE_KEY (kunci rahasia
# Supabase Gedung 2), dipasang dengan `wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging`.
[env.staging]
name = "abadiops-kmbbupr-staging"
workers_dev = true

services = [
  { binding = "PINTU", service = "abadiops-pintu-staging" }
]

[env.staging.vars]
RUMAH = "kmbbupr"
GAS_URL = ""
# Ruang uji di Gedung 1 (docs/SAKLAR.md, 14 Nov): Worker uji membaca/menulis skema uji_*; cermin asli terkunci.
SUPABASE_URL = "https://sptgqsjgszwbreikxdph.supabase.co"
SKEMA_AWALAN = "uji_"
